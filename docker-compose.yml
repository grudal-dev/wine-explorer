services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: terroirs
      POSTGRES_USER: terroirs
      POSTGRES_PASSWORD: terroirs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terroirs"]
      interval: 5s
      retries: 10

  web:
    build: .
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "change-me-in-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DATABASE_URL: postgres://terroirs:terroirs@db:5432/terroirs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
