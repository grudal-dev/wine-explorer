{% if form.non_field_errors %}<div class="flash__item flash__item--error">{{ form.non_field_errors|join:" " }}</div>{% endif %}
{% for field in form %}
<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.errors %}<ul class="errorlist">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
</div>
{% endfor %}
