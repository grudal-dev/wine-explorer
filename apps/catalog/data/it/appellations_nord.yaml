# Appellations et profils types — Piémont, Vénétie, Lombardie, Trentin-Haut-Adige, Frioul, Émilie-Romagne.
# Rédigés pour l'apprentissage à partir de connaissances générales : à faire relire par un œnologue.
# structure : [corps, acidité, tanins, sucrosité], échelle 0-5.

# ───────────── Piémont ─────────────
- appellation: Barolo
  region: Langhe
  classification: DOCG
  lat: 44.610
  lng: 7.940
  profiles:
    - color: rouge
      grapes: {Nebbiolo: 100}
      aromas: {rose: 3, cerise: 2, réglisse: 2, truffe: 2, cuir: 1, violette: 1}
      structure: [4, 5, 5, 0]
      price: [35, 300]
      aging: [10, 40]
      temp: 16-18 °C
      pairings: [tajarin à la truffe, bœuf braisé, gibier]
      description: Le roi des vins italiens, un nebbiolo clair de robe mais puissant en tanins, qui évoque la rose fanée et le goudron avec les années.

