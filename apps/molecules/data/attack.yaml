# Attaque : à quel moment le nez reconnaît la molécule dans le verre (jugement d'expert, à faire relire).
# Pas la volatilité seule : un arôme très volatil ou perçu à de très faibles doses saute au nez dès
# la première inspiration ; les molécules lourdes ou discrètes se révèlent après quelques secondes,
# avec l'aération ou le vieillissement. Sert uniquement à la hauteur des bulles dans le bouquet :
# rien n'est affiché à l'écran (pas de « notes de tête / de fond »).
